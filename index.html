<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#111111">

    <title>Digitális névjegykártya</title>


    <!-- =====================================================
                         ITT SZERKESZD AZ ADATOKAT
         ===================================================== -->

    <script>
        const ADATOK = {

            // NÉV
            nev: "Szikora Márió",

            // VEZETÉKNÉV ÉS KERESZTNÉV A TELEFON NÉVJEGYZÉKÉHEZ
            vezeteknev: "Szikora",
            keresztnev: "Márió",

            // FOGLALKOZÁS
            foglalkozas: "Hidegburkoló",

            // RÖVID LEÍRÁS
            leiras: "Precíz burkolási munkák",

            // TELEFONSZÁM
            telefon: "+36 30 993 6140",

            // E-MAIL
            email: "szikoramario@outlook.hu",

            // INSTAGRAM FELHASZNÁLÓNÉV
            instagram: "@burkol_a_size",

            // INSTAGRAM LINK
            instagramLink: "https://instagram.com/burkol_a_size",

            // MUNKATERÜLET
            helyszin: "Vác és környéke",

            // FACEBOOK FELIRAT
            facebook: "Facebook",

            // FACEBOOK LINK
            facebookLink:
                "https://www.facebook.com/profile.php?id=61589594426608",

            // VÁLLALKOZÁS NEVE
            vallalkozas: "Szikora Márió EV.",

            // HÁTTÉRKÉP
            // Az index.html mellé kerüljön ilyen néven a kép.
            hatterkep: "hatter.jpg",

            // A LETÖLTÖTT NÉVJEGYFÁJL NEVE
            vcardFajlnev: "szikora-mario.vcf"
        };
    </script>


    <!-- =====================================================
                   INNENTŐL NEM KELL SZERKESZTENI
         ===================================================== -->

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: white;
            background-color: #111;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 16px;
        }

        .card {
            width: 100%;
            max-width: 420px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 18, 18, .26),
                    rgba(8, 8, 8, .32)
                );

            border: 1px solid rgba(255, 255, 255, .22);
            border-radius: 28px;

            padding: 32px 22px 24px;

            box-shadow:
                0 20px 55px rgba(0, 0, 0, .32),
                inset 0 1px 0 rgba(255, 255, 255, .08);

            text-align: center;
        }

        h1 {
            font-size: 29px;
            font-weight: 750;
            letter-spacing: 1px;
            margin-bottom: 7px;
        }

        .job {
            color: #d8ad6c;
            font-size: 16px;
            font-weight: 650;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .description {
            color: rgba(255, 255, 255, .84);
            font-size: 15px;
            line-height: 1.6;
            margin-top: 16px;
            margin-bottom: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-bottom: 23px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            max-width: 90px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #c99b58
                );
        }

        .divider::after {
            background:
                linear-gradient(
                    90deg,
                    #c99b58,
                    transparent
                );
        }

        .diamond {
            width: 8px;
            height: 8px;
            background: #d8ad6c;
            transform: rotate(45deg);
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .button {
            width: 100%;
            min-height: 64px;

            display: flex;
            align-items: center;

            text-decoration: none;
            color: white;

            background: rgba(15, 15, 15, .42);
            border: 1px solid rgba(255, 255, 255, .20);
            border-radius: 17px;

            padding: 10px 14px;

            cursor: pointer;

            transition:
                transform .18s ease,
                background .18s ease,
                border-color .18s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            background: rgba(25, 25, 25, .60);
            border-color: rgba(216, 173, 108, .65);
        }

        .button:active {
            transform: scale(.985);
        }

        .button.main {
            background:
                linear-gradient(
                    135deg,
                    rgba(159, 113, 55, .88),
                    rgba(210, 164, 95, .88)
                );

            border-color: rgba(255, 255, 255, .15);
            box-shadow: 0 7px 20px rgba(0, 0, 0, .18);
        }

        .icon {
            width: 43px;
            height: 43px;
            min-width: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 13px;

            border-radius: 50%;
            background: rgba(0, 0, 0, .52);
            border: 1px solid rgba(255, 255, 255, .12);

            color: white;
        }

        .icon svg {
            width: 22px;
            height: 22px;

            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;

            fill: none;
            display: block;
        }

        .button-text {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .button-title,
        .button-subtitle {
            display: block;
        }

        .button-title {
            font-size: 14px;
            font-weight: 750;
            letter-spacing: .7px;
        }

        .button-subtitle {
            font-size: 13px;
            margin-top: 4px;
            color: rgba(255, 255, 255, .70);

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .main .button-subtitle {
            color: rgba(255, 255, 255, .90);
        }

        .arrow {
            margin-left: 10px;
            font-size: 25px;
            font-weight: 300;
            opacity: .70;
        }

        footer {
            margin-top: 25px;
            padding-top: 20px;

            border-top: 1px solid rgba(255, 255, 255, .14);

            color: rgba(255, 255, 255, .58);
            font-size: 12px;
        }

        footer strong {
            color: #d8ad6c;
            font-size: 13px;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            body {
                align-items: flex-start;
                padding: 24px 14px 22px;
                background-attachment: scroll;
            }

            .card {
                padding: 30px 17px 20px;
                border-radius: 24px;
            }

            h1 {
                font-size: 25px;
            }

            .job {
                font-size: 14px;
            }

            .button {
                min-height: 60px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <h1 id="name"></h1>

        <div
            class="job"
            id="job">
        </div>

        <p
            class="description"
            id="description">
        </p>

        <div class="divider">
            <div class="diamond"></div>
        </div>

        <div class="buttons">

            <!-- TELEFON -->

            <a
                class="button main"
                id="phoneButton">

                <span class="icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                </span>

                <span class="button-text">
                    <span class="button-title">
                        HÍVÁS
                    </span>

                    <span
                        class="button-subtitle"
                        id="phoneText">
                    </span>
                </span>

                <span class="arrow">›</span>
            </a>

            <!-- E-MAIL -->

            <a
                class="button"
                id="emailButton">

                <span class="icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect
                            width="20"
                            height="16"
                            x="2"
                            y="4"
                            rx="2">
                        </rect>

                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </svg>
                </span>

                <span class="button-text">
                    <span class="button-title">
                        E-MAIL KÜLDÉSE
                    </span>

                    <span
                        class="button-subtitle"
                        id="emailText">
                    </span>
                </span>

                <span class="arrow">›</span>
            </a>

            <!-- INSTAGRAM -->

            <a
                class="button"
                id="instagramButton"
                target="_blank"
                rel="noopener noreferrer">

                <span class="icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect
                            width="20"
                            height="20"
                            x="2"
                            y="2"
                            rx="5"
                            ry="5">
                        </rect>

                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>

                        <line
                            x1="17.5"
                            x2="17.51"
                            y1="6.5"
                            y2="6.5">
                        </line>
                    </svg>
                </span>

                <span class="button-text">
                    <span class="button-title">
                        INSTAGRAM
                    </span>

                    <span
                        class="button-subtitle"
                        id="instagramText">
                    </span>
                </span>

                <span class="arrow">›</span>
            </a>

            <!-- FACEBOOK -->

            <a
                class="button"
                id="facebookButton"
                target="_blank"
                rel="noopener noreferrer">

                <span class="icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3.5l.5-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                    </svg>
                </span>

                <span class="button-text">
                    <span class="button-title">
                        FACEBOOK
                    </span>

                    <span
                        class="button-subtitle"
                        id="facebookText">
                    </span>
                </span>

                <span class="arrow">›</span>
            </a>

            <!-- NÉVJEGY MENTÉSE -->

            <a
                class="button"
                id="contactButton"
                href="#">

                <span class="icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M16 2v2"></path>
                        <path d="M8 2v2"></path>
                        <path d="M17.915 22a6 6 0 0 0-12 0"></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="4">
                        </circle>

                        <rect
                            x="3"
                            y="4"
                            width="18"
                            height="18"
                            rx="2">
                        </rect>
                    </svg>
                </span>

                <span class="button-text">
                    <span class="button-title">
                        MENTÉS A NÉVJEGYEK KÖZÉ
                    </span>
                </span>

                <span class="arrow">›</span>
            </a>

        </div>

        <footer>
            <strong id="company"></strong>

            <br><br>

            Digitális névjegykártya
        </footer>

    </main>


    <script>
        /* =====================================================
                         ADATOK BETÖLTÉSE
           ===================================================== */

        document.title =
            ADATOK.nev + " | " + ADATOK.foglalkozas;


        /* HÁTTÉRKÉP */

        document.body.style.backgroundImage =
            `linear-gradient(
                rgba(0, 0, 0, .08),
                rgba(0, 0, 0, .16)
            ),
            url("${ADATOK.hatterkep}")`;


        /* NÉV */

        document.getElementById("name").textContent =
            ADATOK.nev;


        /* FOGLALKOZÁS */

        document.getElementById("job").textContent =
            ADATOK.foglalkozas;


        /* LEÍRÁS ÉS HELYSZÍN */

        const description =
            document.getElementById("description");

        description.appendChild(
            document.createTextNode(ADATOK.leiras)
        );

        description.appendChild(
            document.createElement("br")
        );

        description.appendChild(
            document.createTextNode(ADATOK.helyszin)
        );


        /* TELEFON */

        const tisztaTelefon =
            ADATOK.telefon.replace(/\s+/g, "");

        document.getElementById("phoneText").textContent =
            ADATOK.telefon;

        document.getElementById("phoneButton").href =
            "tel:" + tisztaTelefon;


        /* E-MAIL */

        document.getElementById("emailText").textContent =
            ADATOK.email;

        document.getElementById("emailButton").href =
            "mailto:" + ADATOK.email;


        /* INSTAGRAM */

        document.getElementById("instagramText").textContent =
            ADATOK.instagram;

        document.getElementById("instagramButton").href =
            ADATOK.instagramLink;


        /* FACEBOOK */

        document.getElementById("facebookText").textContent =
            ADATOK.facebook;

        document.getElementById("facebookButton").href =
            ADATOK.facebookLink;


        /* VÁLLALKOZÁS */

        document.getElementById("company").textContent =
            ADATOK.vallalkozas;


        /* =====================================================
                       VCARD-BIZTONSÁGOS SZÖVEG
           ===================================================== */

        function vcardSzoveg(szoveg) {
            return String(szoveg ?? "")
                .replace(/\\/g, "\\\\")
                .replace(/\r?\n/g, "\\n")
                .replace(/;/g, "\\;")
                .replace(/,/g, "\\,");
        }


        /* =====================================================
                         NÉVJEGY ELKÉSZÍTÉSE
           ===================================================== */

        function vcardElkeszitese() {
            const sorok = [
                "BEGIN:VCARD",
                "VERSION:3.0",

                "N:" +
                    vcardSzoveg(ADATOK.vezeteknev) + ";" +
                    vcardSzoveg(ADATOK.keresztnev) + ";;;",

                "FN:" +
                    vcardSzoveg(ADATOK.nev),

                "ORG:" +
                    vcardSzoveg(ADATOK.vallalkozas),

                "TITLE:" +
                    vcardSzoveg(ADATOK.foglalkozas),

                "TEL;TYPE=CELL:" +
                    tisztaTelefon,

                "EMAIL;TYPE=INTERNET:" +
                    vcardSzoveg(ADATOK.email),

                "URL;TYPE=Instagram:" +
                    ADATOK.instagramLink,

                "URL;TYPE=Facebook:" +
                    ADATOK.facebookLink,

                "NOTE:" +
                    vcardSzoveg(
                        ADATOK.leiras + " - " + ADATOK.helyszin
                    ),

                "END:VCARD"
            ];

            /*
             * FONTOS:
             * Itt valódi CRLF sortörések készülnek.
             * Az eredeti kódban "\\r\\n" szerepelt,
             * ami nem valódi sortörést hozott létre.
             */

            return sorok.join("\r\n") + "\r\n";
        }


        /* =====================================================
                      ANDROID / IOS NÉVJEGYMENTÉS
           ===================================================== */

        document
            .getElementById("contactButton")
            .addEventListener("click", function (event) {

                event.preventDefault();

                const vcard =
                    vcardElkeszitese();

                const blob =
                    new Blob(
                        [vcard],
                        {
                            type: "text/vcard;charset=utf-8"
                        }
                    );

                const blobUrl =
                    URL.createObjectURL(blob);

                const letoltes =
                    document.createElement("a");

                letoltes.href =
                    blobUrl;

                /*
                 * iPhone/iPad felismerése.
                 *
                 * iOS-en nem adunk download attribútumot,
                 * így a böngésző meg tudja nyitni a névjegyet.
                 *
                 * Androidon és számítógépen letöltjük .vcf-ként.
                 */

                const iOS =
                    /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (
                        navigator.platform === "MacIntel" &&
                        navigator.maxTouchPoints > 1
                    );

                if (!iOS) {
                    letoltes.download =
                        ADATOK.vcardFajlnev;
                }

                letoltes.style.display =
                    "none";

                document.body.appendChild(
                    letoltes
                );

                letoltes.click();

                setTimeout(function () {
                    letoltes.remove();

                    URL.revokeObjectURL(
                        blobUrl
                    );
                }, 10000);
            });
    </script>

</body>

</html>
