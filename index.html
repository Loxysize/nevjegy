<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">

<title>Digitális névjegykártya</title>


<!-- =========================================================
     =========================================================

              ITT SZERKESZD AZ ADATOKAT

     =========================================================
     ========================================================= -->

<script>

const ADATOK = {

    // NÉV
    nev: "Szikora Márió",

    // FOGLALKOZÁS
    foglalkozas: "Hidegburkoló",

    // RÖVID LEÍRÁS
    leiras: "Precíz burkolási munkák",

    // TELEFONSZÁM
    telefon: "+36 30 993 6140",

    // E-MAIL
    email: "szikoramario@outlook.hu",

    // INSTAGRAM FELHASZNÁLÓNÉV
    instagram: "@burkol_a_size",

    // INSTAGRAM LINK
    instagramLink: "https://instagram.com/burkol_a_size",

    // MUNKATERÜLET
    helyszin: "Vác és környéke",

    // FACEBOOK
    facebook: "Facebook",
    facebookLink: "https://www.facebook.com/profile.php?id=61589594426608",

    // VÁLLALKOZÁS NEVE
    vallalkozas: "Szikora Márió EV.",

    // HÁTTÉRKÉP
    hatterkep: "hatter.jpg",
};

</script>


<!-- =========================================================

        INNENTŐL NEM KELL SEMMIT SZERKESZTENED

     ========================================================= -->


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    min-height: 100%;
}

body {

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: white;

    background-color: #111;

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 16px;
}


/* =========================
   KÁRTYA
   ========================= */

.card {

    width: 100%;
    max-width: 420px;

    /*
       KÁRTYA ÁTLÁTSZÓSÁGA

       Az utolsó szám az átlátszatlanság.
       .25 = átlátszóbb
       .40 = sötétebb
       .60 = nagyon sötét

       Jelenleg nagyon átlátszóra van állítva.
    */

    background:
        linear-gradient(
            145deg,
            rgba(18,18,18,.26),
            rgba(8,8,8,.32)
        );

    border:
        1px solid rgba(255,255,255,.22);

    border-radius: 28px;

    padding: 32px 22px 24px;

    /*
       NINCS BACKDROP BLUR!
       Így a háttérkép élesen látszik a kártyán keresztül.
    */

    box-shadow:
        0 20px 55px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.08);

    text-align: center;
}


/* =========================
   NÉV
   ========================= */

h1 {

    font-size: 29px;
    font-weight: 750;

    letter-spacing: 1px;

    margin-bottom: 7px;
}


/* =========================
   FOGLALKOZÁS
   ========================= */

.job {

    color: #d8ad6c;

    font-size: 16px;
    font-weight: 650;

    letter-spacing: 2.5px;

    text-transform: uppercase;
}


/* =========================
   LEÍRÁS
   ========================= */

.description {

    color: rgba(255,255,255,.84);

    font-size: 15px;

    line-height: 1.6;

    margin-top: 16px;
    margin-bottom: 20px;
}


/* =========================
   ELVÁLASZTÓ
   ========================= */

.divider {

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 9px;

    margin-bottom: 23px;
}

.divider::before,
.divider::after {

    content: "";

    height: 1px;

    flex: 1;

    max-width: 90px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #c99b58
        );
}

.divider::after {

    background:
        linear-gradient(
            90deg,
            #c99b58,
            transparent
        );
}

.diamond {

    width: 8px;
    height: 8px;

    background: #d8ad6c;

    transform: rotate(45deg);
}


/* =========================
   GOMBOK
   ========================= */

.buttons {

    display: flex;
    flex-direction: column;

    gap: 11px;
}

.button {

    width: 100%;
    min-height: 64px;

    display: flex;
    align-items: center;

    text-decoration: none;

    color: white;

    background:
        rgba(15,15,15,.42);

    border:
        1px solid rgba(255,255,255,.20);

    border-radius: 17px;

    padding: 10px 14px;

    transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
}

.button:hover {

    transform: translateY(-2px);

    background:
        rgba(25,25,25,.60);

    border-color:
        rgba(216,173,108,.65);
}

.button:active {

    transform: scale(.985);
}


/* =========================
   FŐ HÍVÁS GOMB
   ========================= */

.button.main {

    background:
        linear-gradient(
            135deg,
            rgba(159,113,55,.88),
            rgba(210,164,95,.88)
        );

    border-color:
        rgba(255,255,255,.15);

    box-shadow:
        0 7px 20px rgba(0,0,0,.18);
}


/* =========================
   IKON KÖR
   ========================= */

.icon {

    width: 43px;
    height: 43px;

    min-width: 43px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 13px;

    border-radius: 50%;

    background:
        rgba(0,0,0,.52);

    border:
        1px solid rgba(255,255,255,.12);

    color: white;
}


/* =========================
   MINDEN IKON PONTOSAN
   UGYANAKKORA
   ========================= */

.icon svg {

    width: 22px;
    height: 22px;

    stroke: currentColor;

    stroke-width: 2;

    stroke-linecap: round;
    stroke-linejoin: round;

    fill: none;

    display: block;
}


/* =========================
   GOMB SZÖVEG
   ========================= */

.button-text {

    flex: 1;

    min-width: 0;

    text-align: left;
}

.button-title {

    font-size: 14px;

    font-weight: 750;

    letter-spacing: .7px;
}

.button-subtitle {

    font-size: 13px;

    margin-top: 4px;

    color:
        rgba(255,255,255,.70);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.main .button-subtitle {

    color:
        rgba(255,255,255,.90);
}


/* =========================
   NYÍL
   ========================= */

.arrow {

    margin-left: 10px;

    font-size: 25px;

    font-weight: 300;

    opacity: .70;
}


/* =========================
   FOOTER
   ========================= */

footer {

    margin-top: 25px;

    padding-top: 20px;

    border-top:
        1px solid rgba(255,255,255,.14);

    color:
        rgba(255,255,255,.58);

    font-size: 12px;
}

footer strong {

    color: #d8ad6c;

    font-size: 13px;

    font-weight: 500;
}


/* =========================
   MOBIL
   ========================= */

@media (max-width: 480px) {

    body {

        align-items: flex-start;

        padding:
            24px 14px 22px;

        background-attachment: scroll;
    }

    .card {

        padding:
            30px 17px 20px;

        border-radius: 24px;
    }

    h1 {

        font-size: 25px;
    }

    .job {

        font-size: 14px;
    }

    .button {

        min-height: 60px;
    }

}

</style>

</head>


<body>


<main class="card">


    <!-- =====================
         NÉV
         ===================== -->

    <h1 id="name"></h1>


    <!-- =====================
         FOGLALKOZÁS
         ===================== -->

    <div
        class="job"
        id="job">
    </div>


    <!-- =====================
         LEÍRÁS
         ===================== -->

    <p
        class="description"
        id="description">
    </p>


    <!-- =====================
         ELVÁLASZTÓ
         ===================== -->

    <div class="divider">

        <div class="diamond"></div>

    </div>


    <!-- =====================
         GOMBOK
         ===================== -->

    <div class="buttons">


        <!-- =====================
             TELEFON
             ===================== -->

        <a
            class="button main"
            id="phoneButton">

            <div class="icon">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"></path>
                </svg>

            </div>

            <div class="button-text">

                <div class="button-title">
                    HÍVÁS
                </div>

                <div
                    class="button-subtitle"
                    id="phoneText">
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </a>


        <!-- =====================
             E-MAIL
             ===================== -->

        <a
            class="button"
            id="emailButton">

            <div class="icon">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect
                        width="20"
                        height="16"
                        x="2"
                        y="4"
                        rx="2">
                    </rect>

                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>

            </div>

            <div class="button-text">

                <div class="button-title">
                    E-MAIL KÜLDÉSE
                </div>

                <div
                    class="button-subtitle"
                    id="emailText">
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </a>


        <!-- =====================
             INSTAGRAM
             ===================== -->

        <a
            class="button"
            id="instagramButton"
            target="_blank"
            rel="noopener">

            <div class="icon">

                <svg viewBox="0 0 24 24" aria-hidden="true">

                    <rect
                        width="20"
                        height="20"
                        x="2"
                        y="2"
                        rx="5"
                        ry="5">
                    </rect>

                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>

                    <line
                        x1="17.5"
                        x2="17.51"
                        y1="6.5"
                        y2="6.5">
                    </line>

                </svg>

            </div>

            <div class="button-text">
                <div class="button-title">
                    INSTAGRAM
                </div>
            </div>

            <div class="arrow">
                ›
            </div>

        </a>


        <!-- =====================
             FACEBOOK
             ===================== -->

        <a
            class="button"
            id="facebookButton"
            target="_blank"
            rel="noopener">

            <div class="icon">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3.5l.5-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                </svg>

            </div>

            <div class="button-text">
                <div class="button-title">
                    FACEBOOK
                </div>
            </div>

            <div class="arrow">
                ›
            </div>

        </a>


        <!-- =====================
             NÉVJEGY MENTÉSE
             ===================== -->

        <a
            class="button"
            id="contactButton">

            <div class="icon">

                <svg viewBox="0 0 24 24" aria-hidden="true">

                    <path d="M16 2v2"></path>
                    <path d="M17.915 22a6 6 0 0 0-12 0"></path>
                    <path d="M8 2v2"></path>

                    <circle
                        cx="12"
                        cy="12"
                        r="4">
                    </circle>

                    <rect
                        x="3"
                        y="4"
                        width="18"
                        height="18"
                        rx="2">
                    </rect>

                </svg>

            </div>

            <div class="button-text">
                <div class="button-title">
                    MENTÉS A NÉVJEGYEK KÖZÉ
                </div>
            </div>

            <div class="arrow">
                ›
            </div>

        </a>


    </div>


    <!-- =====================
         LÁBLÉC
         ===================== -->

    <footer>

        <strong id="company"></strong>

        <br><br>

        Digitális névjegykártya

    </footer>


</main>


<script>


/* =========================================================
   ADATOK BETÖLTÉSE
   EHHEZ NEM KELL NYÚLNI
   ========================================================= */


document.title =
    ADATOK.nev + " | " + ADATOK.foglalkozas;


/* =========================
   HÁTTÉRKÉP
   ========================= */

/*
   FONTOS:
   Ez csak nagyon enyhén sötétíti a teljes háttérképet.
   Nincs blur.
*/

document.body.style.backgroundImage =
    `linear-gradient(
        rgba(0,0,0,.08),
        rgba(0,0,0,.16)
     ),
     url("${ADATOK.hatterkep}")`;


/* =========================
   NÉV
   ========================= */

document.getElementById("name").textContent =
    ADATOK.nev;


/* =========================
   FOGLALKOZÁS
   ========================= */

document.getElementById("job").textContent =
    ADATOK.foglalkozas;


/* =========================
   LEÍRÁS
   ========================= */

document.getElementById("description").innerHTML =
    ADATOK.leiras +
    "<br>" +
    ADATOK.helyszin;


/* =========================
   TELEFON
   ========================= */

document.getElementById("phoneText").textContent =
    ADATOK.telefon;

document.getElementById("phoneButton").href =
    "tel:" +
    ADATOK.telefon.replace(/\s/g, "");


/* =========================
   E-MAIL
   ========================= */

document.getElementById("emailText").textContent =
    ADATOK.email;

document.getElementById("emailButton").href =
    "mailto:" +
    ADATOK.email;


/* =========================
   INSTAGRAM
   ========================= */

document.getElementById("instagramButton").href =
    ADATOK.instagramLink;


/* =========================
   FACEBOOK
   ========================= */

document.getElementById("facebookButton").href =
    ADATOK.facebookLink;


/* =========================
   VÁLLALKOZÁS
   ========================= */

document.getElementById("company").textContent =
    ADATOK.vallalkozas;


/* =========================
   NÉVJEGY MENTÉSE
   ========================= */

document.getElementById("contactButton").addEventListener("click", function(event) {

    event.preventDefault();

    const tisztaTelefon =
        ADATOK.telefon.replace(/\\s/g, "");

    const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:;" + ADATOK.nev + ";;;",
        "FN:" + ADATOK.nev,
        "TEL;TYPE=CELL:" + tisztaTelefon,
        "EMAIL;TYPE=INTERNET:" + ADATOK.email,
        "END:VCARD"
    ].join("\\r\\n");

    const blob = new Blob(
        [vcard],
        { type: "text/vcard;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "szikora-mario.vcf";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(function() {
        URL.revokeObjectURL(url);
    }, 2000);

});


</script>


</body>
</html>
