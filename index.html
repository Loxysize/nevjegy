<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Digitális névjegykártya</title>
  <!-- CSAK EZT A RÉSZT KELL SZERKESZTENED -->
  <script>
    const ADATOK = {
      nev: "Szikora Márió",
      vezeteknev: "Szikora",
      keresztnev: "Márió",
      foglalkozas: "Hidegburkoló",
      leiras: "Precíz burkolási munkák",
      telefon: "+36 30 993 6140",
      email: "szikoramario@outlook.hu",
      instagram: "@burkol_a_size",
      instagramLink: "https://instagram.com/burkol_a_size",
      helyszin: "Vác és környéke",
      facebook: "Facebook",
      facebookLink: "https://www.facebook.com/profile.php?id=61589594426608",
      vallalkozas: "Szikora Márió EV.",
      hatterkep: "hatter.jpg",
      vcardFajlnev: "szikora-mario.vcf"
    };
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html{min-height:100%}
    body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:#111 center/cover no-repeat fixed;display:flex;align-items:center;justify-content:center;padding:30px 16px}
    .card{width:100%;max-width:420px;background:linear-gradient(145deg,rgba(18,18,18,.38),rgba(8,8,8,.44));border:1px solid rgba(255,255,255,.22);border-radius:28px;padding:32px 22px 24px;box-shadow:0 20px 55px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.08);text-align:center}
    h1{font-size:29px;font-weight:750;letter-spacing:1px;margin-bottom:7px}
    .job{color:#d8ad6c;font-size:16px;font-weight:650;letter-spacing:2.5px;text-transform:uppercase}
    .description{color:rgba(255,255,255,.84);font-size:15px;line-height:1.6;margin:16px 0 20px}
    .divider{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:23px}
    .divider:before,.divider:after{content:"";height:1px;flex:1;max-width:90px;background:linear-gradient(90deg,transparent,#c99b58)}
    .divider:after{background:linear-gradient(90deg,#c99b58,transparent)}
    .diamond{width:8px;height:8px;background:#d8ad6c;transform:rotate(45deg)}
    .buttons{display:flex;flex-direction:column;gap:11px}
    .button{width:100%;min-height:64px;display:flex;align-items:center;text-decoration:none;color:#fff;background:rgba(15,15,15,.42);border:1px solid rgba(255,255,255,.20);border-radius:17px;padding:10px 14px;transition:transform .18s,background .18s,border-color .18s;cursor:pointer}
    .button:hover{transform:translateY(-2px);background:rgba(25,25,25,.60);border-color:rgba(216,173,108,.65)}
    .button:active{transform:scale(.985)}
    .button.main{background:linear-gradient(135deg,rgba(159,113,55,.88),rgba(210,164,95,.88));border-color:rgba(255,255,255,.15);box-shadow:0 7px 20px rgba(0,0,0,.18)}
    .icon{width:43px;height:43px;min-width:43px;display:flex;align-items:center;justify-content:center;margin-right:13px;border-radius:50%;background:rgba(0,0,0,.52);border:1px solid rgba(255,255,255,.12)}
    .icon svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .button-text{flex:1;min-width:0;text-align:left}.button-title,.button-subtitle{display:block}.button-title{font-size:14px;font-weight:750;letter-spacing:.7px}.button-subtitle{font-size:13px;margin-top:4px;color:rgba(255,255,255,.70);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main .button-subtitle{color:rgba(255,255,255,.90)}
    .arrow{margin-left:10px;font-size:25px;font-weight:300;opacity:.70}
    footer{margin-top:25px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.58);font-size:12px}footer strong{color:#d8ad6c;font-size:13px;font-weight:500}
    @media(max-width:480px){body{align-items:flex-start;padding:24px 14px 22px;background-attachment:scroll}.card{padding:30px 17px 20px;border-radius:24px}h1{font-size:25px}.job{font-size:14px}.button{min-height:60px}}
  </style>
</head>
<body>
<main class="card">
  <h1 id="name"></h1>
  <div class="job" id="job"></div>
  <p class="description" id="description"></p>
  <div class="divider"><div class="diamond"></div></div>
  <div class="buttons">
    <a class="button main" id="phoneButton"><span class="icon"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"/></svg></span><span class="button-text"><span class="button-title">HÍVÁS</span><span class="button-subtitle" id="phoneText"></span></span><span class="arrow">›</span></a>
    <a class="button" id="emailButton"><span class="icon"><svg viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span><span class="button-text"><span class="button-title">E-MAIL KÜLDÉSE</span><span class="button-subtitle" id="emailText"></span></span><span class="arrow">›</span></a>
    <a class="button" id="instagramButton" target="_blank" rel="noopener"><span class="icon">◎</span><span class="button-text"><span class="button-title">INSTAGRAM</span></span><span class="arrow">›</span></a>
    <a class="button" id="facebookButton" target="_blank" rel="noopener"><span class="icon">f</span><span class="button-text"><span class="button-title">FACEBOOK</span></span><span class="arrow">›</span></a>
    <a class="button" id="contactButton" href="#"><span class="icon"><svg viewBox="0 0 24 24"><path d="M16 2v2M8 2v2M17.9 22a6 6 0 0 0-12 0"/><circle cx="12" cy="12" r="4"/><rect x="3" y="4" width="18" height="18" rx="2"/></svg></span><span class="button-text"><span class="button-title">MENTÉS A NÉVJEGYEK KÖZÉ</span></span><span class="arrow">›</span></a>
  </div>
  <footer><strong id="company"></strong><br><br>Digitális névjegykártya</footer>
</main>
<script>
  document.title=ADATOK.nev+" | "+ADATOK.foglalkozas;
  document.body.style.backgroundImage=`linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.16)),url("${ADATOK.hatterkep}")`;
  document.getElementById("name").textContent=ADATOK.nev;
  document.getElementById("job").textContent=ADATOK.foglalkozas;
  document.getElementById("description").innerHTML="";
  document.getElementById("description").append(ADATOK.leiras,document.createElement("br"),ADATOK.helyszin);
  const tisztaTelefon=ADATOK.telefon.replace(/\s+/g,"");
  document.getElementById("phoneText").textContent=ADATOK.telefon;
  document.getElementById("phoneButton").href="tel:"+tisztaTelefon;
  document.getElementById("emailText").textContent=ADATOK.email;
  document.getElementById("emailButton").href="mailto:"+ADATOK.email;
  document.getElementById("instagramButton").href=ADATOK.instagramLink;
  document.getElementById("facebookButton").href=ADATOK.facebookLink;
  document.getElementById("company").textContent=ADATOK.vallalkozas;

  function vcardSzoveg(value){return String(value??"").replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/;/g,"\\;").replace(/,/g,"\\,")}

  document.getElementById("contactButton").addEventListener("click",function(event){
    event.preventDefault();
    /* A mentett névjegy szándékosan csak nevet, telefonszámot és e-mailt tartalmaz. */
    const vcard=[
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:"+vcardSzoveg(ADATOK.vezeteknev)+";"+vcardSzoveg(ADATOK.keresztnev)+";;;",
      "FN:"+vcardSzoveg(ADATOK.nev),
      "TEL;TYPE=CELL:"+tisztaTelefon,
      "EMAIL;TYPE=INTERNET:"+vcardSzoveg(ADATOK.email),
      "END:VCARD"
    ].join("\r\n")+"\r\n";
    const url=URL.createObjectURL(new Blob([vcard],{type:"text/vcard;charset=utf-8"}));
    const link=document.createElement("a");
    const iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
    link.href=url;
    if(!iOS) link.download=ADATOK.vcardFajlnev;
    link.style.display="none";
    document.body.appendChild(link);
    link.click();
    setTimeout(function(){link.remove();URL.revokeObjectURL(url)},10000);
  });
</script>
</body>
</html>
